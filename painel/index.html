<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Y-AKIO · Painel da loja</title>
<link rel="icon" href="../assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;0,700;0,800;1,600&family=Bungee&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF6EF;--card:#fff;--ink:#1A1210;--ink2:#473B36;--line:#D5C7B6;--soft:#F3EADD;--red:#D71D1E;--redd:#A81216;--redbg:#FDE5E4;--ok:#0B6B2C;--okbg:#DDF3E3;--warn:#8A4700;--warnbg:#FFE7BD;--r:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
h1,h2,h3,p{margin:0}
h1{font:400 30px/1.1 Bungee,Archivo,sans-serif;letter-spacing:.5px}
h2{font:400 21px/1.15 Bungee,Archivo,sans-serif;letter-spacing:.4px}
h3{font:800 18px/1.25 Archivo,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--redd)}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sub{color:var(--ink2);font-size:15.5px}
.num{font-family:Bungee,Archivo,sans-serif;font-weight:400}

/* estrutura */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.sb{position:sticky;top:0;height:100vh;background:#fff;border-right:2px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:14px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px}
.brand img{width:52px;height:52px;border-radius:50%;border:2px solid var(--red)}
.brand b{font:400 20px/1 Bungee,sans-serif;color:var(--red);display:block}
.brand small{font-size:13.5px;color:var(--ink2);font-weight:600}
.nv{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 12px;border:0;background:none;border-radius:12px;font-weight:700;font-size:17px;text-align:left;width:100%;color:var(--ink);text-decoration:none}
.nv:hover{background:var(--soft)}
.nv.on{background:var(--red);color:#fff}
.nv .bd{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;min-width:26px;height:26px;display:grid;place-items:center;font-size:14px;font-weight:800;padding:0 7px}
.nv.on .bd{background:#fff;color:var(--redd)}
.sbf{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:2px solid var(--line)}
.zync{font-size:13px;font-weight:700;color:var(--ink2);text-align:center;border:1.5px dashed var(--ink2);border-radius:8px;padding:5px 6px;margin-top:6px}
main{padding:24px 28px 70px;min-width:0}
.top,.bn{display:none}
.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.hd .sp{flex:1}
.lj{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:99px;font-weight:800;font-size:15px;border:2px solid;background:#fff}
.lj.a{color:var(--ok);border-color:var(--ok);background:var(--okbg)}.lj.f{color:var(--redd);border-color:var(--redd);background:var(--redbg)}
.lj i{width:11px;height:11px;border-radius:50%;background:currentColor}

/* controles */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:2px solid var(--ink);background:#fff;font-weight:800;font-size:16.5px;text-decoration:none;color:var(--ink);text-align:center;line-height:1.15}
.btn.p{background:var(--red);border-color:var(--red);color:#fff}
.btn.p:hover{background:var(--redd);border-color:var(--redd)}
.btn.w{background:#0B6B2C;border-color:#0B6B2C;color:#fff}
.btn.k{background:var(--ink);color:#fff}
.btn.s{min-height:44px;padding:0 13px;font-size:15.5px}
.btn.full{width:100%}
.btn.d{border-color:var(--redd);color:var(--redd)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 15px;border-radius:99px;border:2px solid var(--ink);background:#fff;font-weight:700;font-size:15.5px;display:inline-flex;align-items:center;gap:7px}
.chip.on{background:var(--ink);color:#fff}
.chip b{background:var(--soft);color:var(--ink);border-radius:99px;padding:1px 8px;font-size:14px}
.chip.on b{background:#fff}
input[type=text],input[type=tel],input[type=number],input[type=search],select,textarea{width:100%;min-height:48px;border:2px solid var(--ink2);border-radius:11px;background:#fff;padding:9px 12px;font-size:17px}
textarea{min-height:92px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid #1259C3;outline-offset:2px}
.f{display:block}.f>span{display:block;font-weight:700;font-size:15px;margin-bottom:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:3px 9px;font-size:14px;font-weight:800;background:var(--soft);color:var(--ink);white-space:nowrap}
.tag.r{background:var(--red);color:#fff}.tag.g{background:var(--okbg);color:var(--ok)}.tag.y{background:var(--warnbg);color:var(--warn)}.tag.k{background:var(--ink);color:#fff}.tag.rl{background:var(--redbg);color:var(--redd)}
.tag svg.i{width:15px;height:15px}
.note{background:var(--warnbg);color:#4d2800;border-radius:11px;padding:10px 13px;font-weight:600;font-size:15.5px;display:flex;gap:9px;align-items:flex-start}
.demo{font-size:14px;color:var(--ink2);font-weight:600}
.empty{padding:22px 12px;text-align:center;color:var(--ink2);font-weight:600;border:2px dashed var(--line);border-radius:12px}

/* KPIs */
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.k{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:13px 15px}
.k small{display:block;font-size:14.5px;font-weight:700;color:var(--ink2)}
.k b{display:block;font:400 25px/1.2 Bungee,sans-serif;margin-top:3px;word-break:break-word}
.k em{display:block;font-style:normal;font-size:14px;color:var(--ink2);font-weight:600;margin-top:2px}
.k.neg b{color:var(--redd)}.k.pos b{color:var(--ok)}

/* quadro de pedidos */
.board{display:grid;grid-template-columns:repeat(5,minmax(225px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--soft);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:10px;min-height:160px}
.col>header{display:flex;align-items:center;justify-content:space-between;padding:2px 4px}
.col>header b{font:400 16.5px Bungee,sans-serif}
.col>header span{background:var(--ink);color:#fff;border-radius:99px;min-width:30px;height:30px;display:grid;place-items:center;font-weight:800;font-size:15px}
.pc{background:#fff;border:2px solid var(--ink);border-radius:13px;padding:11px;display:flex;flex-direction:column;gap:7px;cursor:pointer}
.pc .t1{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.pc .n{font:400 19px Bungee,sans-serif}
.pc .cl{font-weight:800;font-size:17.5px;line-height:1.2}
.pc .it{font-size:15.5px;line-height:1.3}
.pc .tg{display:flex;gap:5px;flex-wrap:wrap}
.pc.late{border-color:var(--red);box-shadow:0 0 0 3px var(--redbg)}
.pc.fresh{animation:pulse 1s ease-in-out 8;border-color:var(--red)}
.pc.done{border-color:var(--line);cursor:pointer}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(215,29,30,.45)}}
.cst{display:none}

/* listas */
.lst{display:flex;flex-direction:column;gap:8px}
.li{background:#fff;border:2px solid var(--line);border-radius:13px;padding:12px 14px;display:grid;gap:8px 14px;align-items:center}
.li.cli{grid-template-columns:minmax(0,2.2fr) repeat(4,minmax(0,1fr)) auto;cursor:pointer}
.li.cli:hover{border-color:var(--ink)}
.li small{display:block;font-size:13.5px;font-weight:700;color:var(--ink2)}
.li .v{font-weight:800}
.li.est{grid-template-columns:minmax(0,1.5fr) minmax(0,1.3fr) auto}
@media(max-width:899px){.li.est{grid-template-columns:1fr}.lj-d{display:none}}
.tb{width:100%;border-collapse:collapse}
.tb th{font-size:14.5px;text-align:left;padding:6px 8px;color:var(--ink2)}
.tb td{padding:6px 8px;border-top:1.5px solid var(--line);vertical-align:middle}
.tw{overflow-x:auto}
.bar{height:16px;background:var(--soft);border-radius:99px;position:relative;overflow:hidden;border:1.5px solid var(--line)}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--ok)}
.bar.lo>i{background:var(--red)}.bar.md>i{background:#B45F00}
.barw{position:relative}.barw>u{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);left:40%;border-radius:2px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--redd);background:#fff}
.dots i.on{background:var(--red)}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden;flex-wrap:wrap;background:#fff}
.seg button{min-height:46px;padding:0 15px;border:0;background:#fff;font-weight:700;font-size:15.5px}
.seg button.on{background:var(--ink);color:#fff}
.sw{min-height:44px;min-width:44px;border-radius:11px;border:2px solid var(--ok);background:var(--okbg);color:var(--ok);font-weight:800;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 10px}
.sw.off{border-color:var(--redd);background:var(--red);color:#fff}
.mx{display:grid;grid-template-columns:minmax(120px,1.1fr) repeat(4,minmax(0,1fr));gap:8px 10px;align-items:center;padding:10px 0;border-top:1.5px solid var(--line)}
.mx .cel{display:flex;gap:6px;align-items:center}
.mx .cel label{display:none;font-size:13.5px;font-weight:700}
.mx input{min-width:0;padding:8px 8px}
.mxh{display:grid;grid-template-columns:minmax(120px,1.1fr) repeat(4,minmax(0,1fr));gap:10px;font-size:14.5px;font-weight:800;color:var(--ink2);padding-bottom:6px}

/* gráficos */
.vb{display:flex;align-items:flex-end;gap:3px;height:150px;border-bottom:2px solid var(--ink)}
.vb div{flex:1;background:var(--red);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.vb div.z{background:var(--line)}
.vbl{display:flex;gap:3px;font-size:12.5px;font-weight:700;color:var(--ink2);margin-top:4px}
.vbl span{flex:1;text-align:center;overflow:hidden;white-space:nowrap}
.hb{display:grid;grid-template-columns:minmax(84px,auto) minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:15.5px;font-weight:700}
.hb .t{height:22px;background:var(--soft);border-radius:6px;overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--red);border-radius:6px}
.hb .t i.k{background:var(--ink)}
.hero{background:var(--red);color:#fff;border-radius:18px;padding:20px 22px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 100%,transparent 0 38px,rgba(168,18,22,.75) 39px 42px,transparent 43px 58px,rgba(168,18,22,.75) 59px 62px,transparent 63px 78px,rgba(168,18,22,.75) 79px 82px,transparent 83px);background-size:170px 170px;opacity:.9}
.hero>*{position:relative}
.hero .big{font:400 clamp(34px,7vw,56px)/1.05 Bungee,sans-serif;margin:6px 0}
.hero input{width:84px;min-height:44px;display:inline-block;color:var(--ink)}
.split{display:flex;height:34px;border-radius:9px;overflow:hidden;border:2px solid var(--ink)}
.split i{display:grid;place-items:center;font-style:normal;font-weight:800;font-size:14.5px;color:#fff;background:var(--red);min-width:0;overflow:hidden;white-space:nowrap}
.split i+i{background:var(--ink)}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}

/* modal e aviso */
#modal:empty{display:none}
.mo{position:fixed;inset:0;background:rgba(26,18,16,.62);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:26px 14px;overflow-y:auto}
.mb{background:var(--bg);border-radius:18px;width:100%;max-width:640px;border:2px solid var(--ink)}
.mb.wide{max-width:820px}
.mb>header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:2px solid var(--line);position:sticky;top:0;background:var(--bg);border-radius:18px 18px 0 0;z-index:2}
.mb>header h2{flex:1}
.mc{padding:16px;display:flex;flex-direction:column;gap:14px}
.x{width:46px;height:46px;border-radius:12px;border:2px solid var(--ink);background:#fff;display:grid;place-items:center;flex:none}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;width:min(92vw,520px);pointer-events:none}
#toast div{background:var(--ink);color:#fff;padding:13px 16px;border-radius:12px;font-weight:700;border-left:8px solid var(--red);box-shadow:0 6px 20px rgba(0,0,0,.3)}
canvas.art{width:100%;max-width:340px;height:auto;border-radius:14px;border:2px solid var(--ink);display:block;margin:0 auto}
.tl{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14.5px;font-weight:700;color:var(--ink2)}

@media(min-width:900px) and (max-width:1199px){
 .app{grid-template-columns:78px minmax(0,1fr)}
 .brand div,.nv span.tx,.zync,.sbf .tx{display:none}
 .nv{justify-content:center;padding:0;position:relative}.nv .bd{position:absolute;top:2px;right:2px;margin:0;min-width:22px;height:22px;font-size:12.5px}
 .brand{justify-content:center;padding:4px 0 12px}
 main{padding:20px 18px 60px}
}
@media(max-width:899px){
 .app{display:block}.sb{display:none}
 main{padding:14px 16px 100px}
 h1{font-size:24px}
 .top{display:flex;align-items:center;gap:10px;background:var(--red);color:#fff;padding:9px 14px;position:sticky;top:0;z-index:30}
 .top img{width:40px;height:40px;border-radius:50%;border:2px solid #fff}
 .top b{font:400 18px Bungee,sans-serif;flex:1}
 .top .lj{min-height:44px;font-size:14.5px;padding:0 12px}
 .bn{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--ink);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
 .bn button{flex:1;min-width:0;min-height:62px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px;font-weight:800;position:relative;color:var(--ink)}
 .bn button.on{color:#fff;background:var(--red)}
 .bn .bd{position:absolute;top:5px;left:54%;background:var(--red);color:#fff;border-radius:99px;min-width:21px;height:21px;font-size:12.5px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
 .cst{display:flex;margin-bottom:10px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}
 .cst .chip{flex:none}
 .board{display:block;overflow:visible}
 .col{display:none}.col.on{display:flex}
 .li.cli{grid-template-columns:1fr 1fr}
 .li.cli>.nm,.li.cli>.ac{grid-column:1/-1}
 .g3{grid-template-columns:1fr 1fr}
 .mx,.mxh{grid-template-columns:1fr 1fr}
 .mxh{display:none}
 .mx>.nm{grid-column:1/-1}
 .mx .cel{flex-wrap:wrap}.mx .cel label{display:block;width:100%}
 .mx .cel input{flex:1}
 .mo{padding:0;align-items:stretch}.mb{border-radius:0;border:0;min-height:100%}.mb>header{border-radius:0}
 #toast{bottom:76px}
}
@media(max-width:520px){.g2.m1{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.pc.fresh{animation:none}}
</style>
</head>
<body>
<div class="top"><img src="../assets/logo.jpg" alt=""><b>Y-AKIO</b><span id="ljTop"></span></div>
<div class="app">
 <aside class="sb" id="sb" aria-label="Menu"></aside>
 <main id="main"></main>
</div>
<nav class="bn" id="bn" aria-label="Menu"></nav>
<div id="modal"></div>
<div id="toast" aria-live="polite"></div>
<script src="../shared/data.js"></script>
<script>
'use strict';
/* ============ base ============ */
const $ = s => document.querySelector(s), main = $('#main');
const brl = YK.brl, DIA = 864e5;
let D = YK.db(), M = null, pend = false, silent = false;
const known = new Set(D.pedidos.map(p => p.id));
const S = { view: 'pedidos', col: 'novo', ent: 'acerto', entPer: 'hoje', seg: 'todos', q: '', ord: 'ultimo', est: 'insumos', card: 'menu', tam: 'individual', per: '30', ftel: '', fresh: new Set(), sent: new Set() };

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(/\./g, m => m).replace(',', '.')); return isFinite(n) ? n : 0; };
const sod = (t = Date.now()) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const dias = iso => iso ? Math.floor((sod() - sod(new Date(iso).getTime())) / DIA) : 999;
const mins = iso => Math.max(0, Math.round((Date.now() - new Date(iso)) / 6e4));
const p2 = n => String(n).padStart(2, '0');
const hm = iso => { const d = new Date(iso); return p2(d.getHours()) + ':' + p2(d.getMinutes()); };
const dm = iso => { const d = new Date(iso); return p2(d.getDate()) + '/' + p2(d.getMonth() + 1); };
const quando = iso => { if (!iso) return 'nunca'; const n = dias(iso); return n <= 0 ? 'hoje' : n === 1 ? 'ontem' : 'há ' + n + ' dias'; };
const dur = m => m < 60 ? m + ' min' : Math.floor(m / 60) + 'h' + p2(m % 60);
const pnome = n => { const w = String(n || '').trim().split(/\s+/); return /^(dona|seu|sr|sra|dr|dra|d)\.?$/i.test(w[0]) && w[1] ? w[0] + ' ' + w[1] : /^(escrit|cl[ií]nica|loja|col[eé]gio|consult)/i.test(w[0]) ? 'pessoal' : w[0] || ''; };
const telFmt = t => { t = YK.tel(t); return t.length >= 10 ? '(' + t.slice(0, 2) + ') ' + t.slice(2, t.length - 4) + '-' + t.slice(-4) : t; };
const sum = (a, f) => a.reduce((s, x) => s + (f(x) || 0), 0);
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const cli = id => D.clientes.find(c => c.id === id);
const ped = id => D.pedidos.find(p => p.id === id);
const tamN = id => (D.tamanhos.find(t => t.id === id) || {}).nome || id;
const sabN = id => (D.sabores.find(t => t.id === id) || {}).nome || id;
const entN = id => (D.entregadores.find(e => e.id === id) || {}).nome || 'Sem entregador';
const stN = id => (YK.STATUS.find(s => s.id === id) || {}).nome || id;
const CANAL = { site: 'Site', whatsapp: 'WhatsApp', balcao: 'Balcão', ifood: 'iFood' };
const pagN = id => (YK.PAGAMENTOS.find(x => x.id === id) || {}).nome || id || '';
const pagOn = id => !!(YK.PAGAMENTOS.find(x => x.id === id) || {}).online;
const isPago = p => p.pago != null ? !!p.pago : (pagOn(p.pagamento) || p.canal === 'ifood'); // pedidos antigos sem o campo: assume pelo tipo
const cfgPag = (d = D) => { const c = d.config.pagamentos = d.config.pagamentos || {}; c.mercadoPago = c.mercadoPago || { conectado: false, conta: '' }; c.aceita = c.aceita || {}; c.taxasPct = c.taxasPct || {}; return c; };
const viaMP = p => p.canal === 'site' && pagOn(p.pagamento) && isPago(p);
const taxaMP = p => viaMP(p) ? p.total * (cfgPag().taxasPct[p.pagamento] || 0) / 100 : 0;
const tSh = (iso, p) => +new Date(iso) - (p.demoShift || 0); // pedidos de exemplo "de hoje" têm o relógio deslocado para cair no horário de funcionamento
function pagTag(p) {
  const n = esc(pagN(p.pagamento));
  if (isPago(p)) return `<span class="tag g">${ic('check')}${p.canal === 'ifood' ? 'Pago no iFood' : viaMP(p) ? 'Pago online' : 'Pago'} · ${n}</span>`;
  if (/concluido|cancelado/.test(p.status)) return `<span class="tag">${n}</span>`;

const tHist = (p, s) => { const h = p.hist.filter(x => x.s === s).pop(); return h ? h.t : p.criado; };
function tempoTag(p) {
  if (p.status === 'concluido' || p.status === 'cancelado') return `<span class="tag">${dias(p.criado) ? dm(p.criado) + ' ' : ''}${hm(p.criado)}</span>`;

    <label class="f"><span>Taxa do iFood (%), estimativa</span><input type="text" inputmode="decimal" value="${c.taxaIfoodPct}" data-c="cfg" data-k="taxaIfoodPct"></label><label class="f"><span>Chave Pix</span><input type="text" value="${esc(c.pixChave)}" data-c="cfg" data-k="pixChave"></label></div>
    <p class="sub">O tempo de preparo define quando o cartão do pedido fica vermelho no quadro.</p></div>`;
};
function vPagamentos() {
  const c = cfgPag(), mp = c.mercadoPago, hoje = D.pedidos.filter(p => viaMP(p) && p.status !== 'cancelado' && dias(p.pagoEm || p.criado) === 0), br = sum(hoje, p => p.total), tx = sum(hoje, taxaMP);
  return `<div class="card stack" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><h2>Mercado Pago</h2><span class="tag ${mp.conectado ? 'g' : 'rl'}">${ic(mp.conectado ? 'check' : 'alert')}${mp.conectado ? 'Conta conectada' : 'Desconectada'}</span></div>
    <p>${mp.conectado ? `Conta: <b>${esc(mp.conta || 'sem nome')}</b>. O dinheiro dos pagamentos online cai direto nela.` : 'Sem a conta conectada, o site só oferece pagamento na entrega.'}</p>
    <div class="note">${ic('alert')}<span>Conta de demonstração: nenhum pagamento real é processado. Na versão final, você conecta a sua conta com um clique.</span></div>
    <button class="btn s" style="align-self:flex-start" data-a="mpTog">${mp.conectado ? 'Desconectar (simular)' : 'Conectar conta (simular)'}</button></div>
   <div class="card stack" style="margin-bottom:14px"><h2>Formas de pagamento no site</h2><p class="sub">Desligou aqui, some do site na hora. As taxas são as do seu plano no Mercado Pago (valores de exemplo).</p>
    ${YK.PAGAMENTOS.map(f => { const on = c.aceita[f.id] !== false; return `<div class="row" style="border-top:1.5px solid var(--line);padding-top:10px"><div style="flex:1 1 180px"><b>${esc(f.nome)}</b><br><span class="tag">${f.online ? 'pago online, na hora do pedido' : 'cobrado na entrega ou retirada'}</span></div>
      ${f.online ? `<label class="row" style="flex-wrap:nowrap;font-weight:700;font-size:15px">Taxa<input type="text" inputmode="decimal" value="${String(c.taxasPct[f.id] == null ? 0 : c.taxasPct[f.id]).replace('.', ',')}" data-c="pagTaxa" data-k="${f.id}" style="width:84px" aria-label="Taxa de ${esc(f.nome)} em %">%</label>` : '<span class="tag g">sem taxa</span>'}
      <button class="sw ${on ? '' : 'off'}" data-a="pagTog" data-k="${f.id}" aria-label="${esc(f.nome)}: ${on ? 'ligado, tocar para desligar' : 'desligado, tocar para ligar'}">${ic(on ? 'check' : 'pause')}${on ? 'Ligado' : 'Desligado'}</button></div>`; }).join('')}</div>
   <div class="card stack"><h2>Recebimentos online de hoje</h2>
    <div class="kp"><div class="k"><small>Recebido online</small><b>${brl(br)}</b><em>${hoje.length} pedido${hoje.length === 1 ? '' : 's'}</em></div><div class="k neg"><small>Taxas do Mercado Pago</small><b>${brl(tx)}</b><em>estimativa</em></div><div class="k pos"><small>Cai na conta</small><b>${brl(br - tx)}</b></div></div>
    ${hoje.length ? `<div class="tw"><table class="tb"><tr><th>Hora</th><th>Pedido</th><th>Forma</th><th>Valor</th><th>Taxa</th><th>Líquido</th></tr>${hoje.map(p => `<tr><td>${hm(p.pagoEm || p.criado)}</td><td><b>#${p.num}</b> ${esc(p.cliente.nome)}</td><td>${esc(pagN(p.pagamento))}</td><td>${brl(p.total)}</td><td>${brl(taxaMP(p))}</td><td><b>${brl(p.total - taxaMP(p))}</b></td></tr>`).join('')}</table></div>` : '<div class="empty">Nenhum pagamento online hoje ainda.</div>'}
    <p class="sub">Pix recebido direto na sua chave (pedido de WhatsApp ou balcão) não passa pelo Mercado Pago e não tem taxa.</p></div>`;
}
A.mpTog = () => { mut(d => { const m = cfgPag(d).mercadoPago; m.conectado = !m.conectado; if (m.conectado && !m.conta) m.conta = 'Y-AKIO (demonstração)'; }); toast(cfgPag().mercadoPago.conectado ? 'Conta conectada (demonstração).' : 'Conta desconectada (demonstração).'); };
A.pagTog = el => { const k = el.dataset.k; mut(d => { const a = cfgPag(d).aceita; a[k] = a[k] === false; }); toast(pagN(k) + (cfgPag().aceita[k] === false ? ': desligado no site.' : ': ligado no site.'), 2500); };
CH.pagTaxa = el => { mut(d => { cfgPag(d).taxasPct[el.dataset.k] = Math.max(0, num(el.value)); }); toast('Taxa salva.', 2200); };
A.loja = el => { mut(d => { d.config.lojaAberta = el.dataset.v; }); toast(YK.aberta(D) ? 'Site aceitando pedidos.' : 'Site fechado para pedidos.'); };
A.pausa = el => { const k = el.dataset.k; mut(d => { const i = d.pausados.indexOf(k); if (i < 0) d.pausados.push(k); else d.pausados.splice(i, 1); }); toast(D.pausados.includes(k) ? 'Pausado. Sumiu do site.' : 'De volta ao site.', 2500); };
A.pausaSab = el => { const s = el.dataset.s; mut(d => { const ks = d.tamanhos.map(t => t.id + ':' + s), all = ks.every(k => d.pausados.includes(k)); d.pausados = d.pausados.filter(k => !ks.includes(k)); if (!all) d.pausados.push(...ks); }); };
CH.preco = el => { const v = num(el.value); if (v <= 0) return toast('Preço inválido.'); mut(d => { d.precos[el.dataset.t][el.dataset.s] = v; }); toast(`${tamN(el.dataset.t)} ${sabN(el.dataset.s)} agora custa ${brl(v)}.`, 2500); };
CH.xpreco = el => { const v = num(el.value); if (v <= 0) return toast('Preço inválido.'); mut(d => { d.extras[+el.dataset.i].preco = v; d.extras[+el.dataset.i].real = true; }); };
CH.xnome = el => mut(d => { const x = d.extras[+el.dataset.i]; x.nome = el.value.trim() || x.nome; });
A.xAdd = () => mut(d => d.extras.push({ id: YK.uid('x'), cat: 'Bebidas', nome: 'Novo item', preco: 5, real: true }));
A.xDel = el => { if (confirm('Remover este item do cardápio?')) mut(d => { const x = d.extras.splice(+el.dataset.i, 1)[0]; d.pausados = d.pausados.filter(k => k !== x.id); }); };
CH.cfg = el => { const k = el.dataset.k; mut(d => { d.config[k] = k === 'pixChave' ? el.value.trim() : Math.max(0, num(el.value)); }); toast('Ajuste salvo.', 2200); };

/* ============ 7. RESULTADOS ============ */
const hbars = (rows, dark) => { const mx = Math.max(1, ...rows.map(r => r[1])); return `<div class="hb">${rows.map(([l, v, t]) => `<span>${esc(l)}</span><span class="t"><i class="${dark ? 'k' : ''}" style="width:${v / mx * 100}%"></i></span><b>${t != null ? t : v}</b>`).join('')}</div>`; };
function vbars(rows) {
  const mx = Math.max(1, ...rows.map(r => r[1])), st = Math.ceil(rows.length / 8);
  return `<div class="vb" role="img" aria-label="Gráfico de barras">${rows.map(([l, v, t]) => `<div class="${v ? '' : 'z'}" style="height:${Math.max(1.5, v / mx * 100)}%" title="${esc(l)}: ${t != null ? t : v}"></div>`).join('')}</div><div class="vbl">${rows.map(([l], i) => `<span>${i % st === 0 ? esc(l) : ''}</span>`).join('')}</div>`;
}
V.resultados = () => {
  const nd = S.per === 'hoje' ? 1 : +S.per, ini = sod() - (nd - 1) * DIA, c = D.config;
  const ps = D.pedidos.filter(p => p.status !== 'cancelado' && +new Date(p.criado) >= ini), fat = sum(ps, p => p.total), n = ps.length;
  const dir = ps.filter(p => p.canal !== 'ifood'), fd = sum(dir, p => p.total), eco = fd * c.taxaIfoodPct / 100, fi = fat - fd;
  const txMP = sum(ps, taxaMP), brMP = sum(ps.filter(viaMP), p => p.total);
  const cmv = sum(ps, custoPed), prod = sum(ps, p => p.subtotal), ret = ps.filter(p => p.tipo === 'retirada'), pr = pct(ret.length, n);
  const cont = (f) => { const o = {}; ps.forEach(p => p.itens.forEach(i => { if (i.tipo === 'yaki') o[i[f]] = (o[i[f]] || 0) + i.qtd; })); return o; };
  const sb = cont('sabor'), tm = cont('tamanho'), hrs = {}; ps.forEach(p => { const h = new Date(p.criado).getHours(); hrs[h] = (hrs[h] || 0) + 1; });
  const hk = [...new Set([11, 12, 13, 18, 19, 20].concat(Object.keys(hrs).map(Number)))].sort((a, b) => a - b), pico = hk.slice().sort((a, b) => (hrs[b] || 0) - (hrs[a] || 0))[0];
  const porDia = Array.from({ length: nd }, (_, i) => { const d0 = ini + i * DIA, l = ps.filter(p => sod(+new Date(p.criado)) === d0); return [dm(d0), sum(l, p => p.total), brl(sum(l, p => p.total)) + ' · ' + l.length + ' pedidos']; });
  const lbl = S.per === 'hoje' ? 'hoje' : 'nos últimos ' + nd + ' dias';
  return hd('Resultados', 'O que entrou, de onde veio e quanto ficou.', segBtn('per', [['hoje', 'Hoje'], ['7', '7 dias'], ['30', '30 dias']], S.per, 'sset')) + `
   <div class="hero" style="margin-bottom:14px"><p style="font-weight:800;font-size:18px">Quanto você deixou de pagar ao iFood ${lbl}</p><p class="big">${brl(eco)}</p>
    <p style="font-weight:600">${brl(fd)} vendidos direto (site, WhatsApp e balcão) × <input type="text" inputmode="decimal" value="${c.taxaIfoodPct}" data-c="cfg" data-k="taxaIfoodPct" aria-label="Taxa do iFood em %"> % de taxa do iFood. <b>Estimativa</b>: ajuste a porcentagem para a do seu contrato.</p>
    <p style="font-weight:600;margin-top:6px">Para a conta ficar honesta: receber online pelo Mercado Pago custou perto de ${brl(txMP)} em taxas (${brl(brMP)} pagos no site). <b>Economia líquida: ${brl(eco - txMP)}.</b></p>
    ${fi ? `<p style="font-weight:600;margin-top:6px">Os ${brl(fi)} que ainda vieram pelo iFood custaram perto de ${brl(fi * c.taxaIfoodPct / 100)} em taxa.</p>` : ''}</div>
   <div class="kp" style="margin-bottom:14px"><div class="k"><small>Faturamento</small><b>${brl(fat)}</b></div><div class="k"><small>Pedidos</small><b>${n}</b></div><div class="k"><small>Ticket médio</small><b>${brl(n ? fat / n : 0)}</b></div>
    <div class="k"><small>Custo dos insumos (CMV)</small><b>${brl(cmv)}</b><em>${pct(cmv, prod)}% das vendas · estimado pela ficha técnica</em></div><div class="k pos"><small>Sobra depois dos insumos</small><b>${brl(prod - cmv)}</b></div><div class="k"><small>Taxas de pagamento online</small><b>${brl(txMP)}</b><em>Mercado Pago · estimativa</em></div></div>
   ${n ? `<div class="cols2">
    ${nd > 1 ? `<div class="card stack"><h2>Faturamento por dia</h2>${vbars(porDia)}<p class="sub">Segunda a loja fecha. Passe o dedo ou o mouse na barra para ver o valor.</p></div>` : ''}
    <div class="card stack"><h2>Horário de pico</h2>${vbars(hk.map(h => [h + 'h', hrs[h] || 0, (hrs[h] || 0) + ' pedidos']))}<p class="sub">Mais movimento às <b>${pico}h</b>. É quando vale ter a chapa adiantada.</p></div>
    <div class="card stack"><h2>Retirada x entrega</h2><div class="split"><i style="width:${Math.max(pr, n - ret.length ? 0 : 100)}%">${pr >= 12 ? 'Retirada ' + pr + '%' : ''}</i><i style="flex:1">${100 - pr >= 12 ? 'Entrega ' + (100 - pr) + '%' : ''}</i></div><p>${ret.length} retiradas (${brl(sum(ret, p => p.total))}) · ${n - ret.length} entregas (${brl(fat - sum(ret, p => p.total))})</p></div>
    <div class="card stack"><h2>De onde vieram os pedidos</h2>${hbars(Object.keys(CANAL).map(k => { const l = ps.filter(p => p.canal === k); return [CANAL[k], sum(l, p => p.total), l.length + ' · ' + brl(sum(l, p => p.total))]; }), true)}<p class="sub">${pct(dir.length, n)}% dos pedidos já são diretos, sem taxa de aplicativo.</p></div>
    <div class="card stack"><h2>Formas de pagamento</h2>${hbars(YK.PAGAMENTOS.map(f => { const l = ps.filter(p => p.pagamento === f.id); return [f.nome, sum(l, p => p.total), l.length + ' · ' + brl(sum(l, p => p.total))]; }).filter(r => r[1]).sort((a, b) => b[1] - a[1]))}<p class="sub">Taxas do Mercado Pago no período: <b>${brl(txMP)}</b> (${pct(txMP * 100, (brMP || 1) * 100) ? (txMP / (brMP || 1) * 100).toFixed(1).replace('.', ',') : '0'}% do que foi pago no site). Pix direto, dinheiro e maquininha ficam fora desta conta.</p></div>
    <div class="card stack"><h2>Sabores mais vendidos</h2>${hbars(D.sabores.map(s => [s.nome, sb[s.id] || 0]).sort((a, b) => b[1] - a[1]))}</div>
    <div class="card stack"><h2>Tamanhos mais vendidos</h2>${hbars(D.tamanhos.map(t => [t.nome, tm[t.id] || 0]).sort((a, b) => b[1] - a[1]))}</div></div>` : '<div class="empty">Nenhum pedido neste período ainda.</div>'}
   <p class="demo" style="margin-top:14px">Demonstração Zync: histórico, custos e taxa do iFood são dados de exemplo.</p>`;
};

/* ============ início ============ */
YK.on(d => {
  let novo = null;
  d.pedidos.forEach(p => { if (!known.has(p.id)) { known.add(p.id); if (p.status === 'novo' && !silent) { S.fresh.add(p.id); novo = p; setTimeout(() => S.fresh.delete(p.id), 25000); } } });
  D = d;
  if (novo) { beep(); toast(`Pedido novo! #${novo.num} · ${novo.cliente.nome} · ${CANAL[novo.canal] || ''}`, 7000); }
  if (M && M.t === 'ped' && !ped(M.id)) closeM();
  safeRender();
});
document.addEventListener('pointerdown', () => { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {} }, { once: true });
gerarDemo(); D = YK.db(); D.pedidos.forEach(p => known.add(p.id));
if (V[location.hash.slice(1)]) S.view = location.hash.slice(1);
render();
setInterval(() => { if (!M && (S.view === 'pedidos' || S.view === 'entregas')) safeRender(); }, 30000);
</script>
</body>
